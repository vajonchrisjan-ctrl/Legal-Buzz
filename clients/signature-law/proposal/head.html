<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8">
<title>Signature Law — Growth Proposal — legalbuzz</title>
<style>
__FONTS__
:root{
 --ink:#050505; --navy:#000d1f; --yellow:#f5d400; --blue:#0099e6;
 --success:#229652; --warning:#f99806; --danger:#ef4343;
 --border:#d6d6dc; --surface:#f2f2f3; --muted:#595959; --white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}

@page{size:A4;margin:13mm 15mm 21mm;
 @bottom-left{content:"legalbuzz";font-family:'Outfit';font-weight:800;font-size:7.4pt;color:#000d1f;border-top:1px solid #d6d6dc;padding-top:3mm;width:100%}
 @bottom-center{content:"Signature Law \2014  Growth Proposal \00B7  October 2026";font-family:'DM Sans';font-size:7.2pt;color:#595959;border-top:1px solid #d6d6dc;padding-top:3mm;width:100%}
 @bottom-right{content:"legalbuzz \00B7  " counter(page) "/" counter(pages);font-family:'DM Sans';font-size:7.2pt;color:#595959;border-top:1px solid #d6d6dc;padding-top:3mm;width:100%;text-align:right}}
@page :first{margin:0;@bottom-left{content:none;border:0}@bottom-center{content:none;border:0}@bottom-right{content:none;border:0}}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);font-size:8.9pt;line-height:1.42}
.cover{width:210mm;height:297mm;overflow:hidden;break-after:page;position:relative}
.contents{break-after:page}
.flow{display:block}
.sec{break-before:page;break-inside:avoid}
.sec.first{break-before:auto}
.card,.grid>div{break-inside:avoid}
h3.sub{break-after:avoid}
tr{break-inside:avoid}
thead{display:table-header-group}
.endmark{text-align:center;margin-top:14mm;break-inside:avoid}
.kicker{font-family:'Outfit';font-weight:800;font-size:7.6pt;letter-spacing:.17em;text-transform:uppercase;color:var(--yellow)}
.kicker.dark{color:var(--navy)}
h1,h2,h3,h4,.disp{font-family:'Outfit',sans-serif;letter-spacing:-.025em;line-height:1.08}

/* section opener block */
.sec{position:relative;background:var(--navy);color:var(--white);border-radius:12px;padding:6.5mm 9mm 6mm;overflow:hidden;margin-bottom:5mm}
.sec .num{position:absolute;right:6mm;top:-6mm;font-family:'Outfit';font-weight:900;font-size:62pt;color:rgba(255,255,255,.075);line-height:1}
.sec h2{font-size:19.5pt;font-weight:800;margin-top:2.5mm;max-width:150mm}
.sec p{margin-top:2mm;font-size:8.8pt;color:#c3ccd8;max-width:152mm}

h3.sub{font-size:12.5pt;font-weight:700;padding-left:4mm;border-left:3px solid var(--yellow);margin:4.5mm 0 2.4mm}
h3.sub:first-child{margin-top:0}
p{margin-bottom:2mm}
p.lead{font-size:9.6pt;color:#2a2a2a}
.muted{color:var(--muted)}
small{font-size:7.3pt;color:var(--muted);display:block;line-height:1.45}
strong{font-weight:700}
ul{margin:0 0 3mm 4.6mm}li{margin-bottom:1mm}

.card{border:1px solid var(--border);border-radius:10px;padding:3.6mm 4.4mm;background:var(--white)}
.card.s{background:var(--surface)}
.card.dark{background:var(--navy);color:var(--white);border-color:var(--navy)}
.card.dark .kicker{color:var(--yellow)}
.card.dark small{color:#9fb0c2}
.card.warn{border-left:3px solid var(--warning)}
.card.dang{border-left:3px solid var(--danger)}
.grid{display:grid;gap:3mm}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}

table{width:100%;border-collapse:collapse;font-size:7.8pt}
th{background:var(--navy);color:var(--white);font-family:'Outfit';font-weight:700;font-size:6.6pt;
 letter-spacing:.11em;text-transform:uppercase;text-align:left;padding:2mm 2.2mm}
td{padding:1.5mm 2.2mm;border-bottom:1px solid var(--border);vertical-align:top}
tr:nth-child(even) td{background:#fafafb}
th:first-child{border-radius:7px 0 0 0}th:last-child{border-radius:0 7px 0 0}
.num-c{text-align:right;font-variant-numeric:tabular-nums}

.pill{display:inline-block;font-family:'Outfit';font-weight:700;font-size:6.8pt;letter-spacing:.07em;
 text-transform:uppercase;padding:.9mm 2mm;border-radius:99px;white-space:nowrap}
.p-crit{background:#fde3e3;color:#a81e1e}.p-med{background:#fdeccf;color:#8a5200}
.p-pass{background:#d8f0e2;color:#136b39}.p-low{background:#e7e7ea;color:#4a4a4a}
.p-you{background:var(--yellow);color:var(--ink)}.p-nm{background:#e2eef7;color:#0b5c88}
</style></head><body>
